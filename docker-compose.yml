# Lokale Testumgebung auf dem Heimserver (nur lokal, keine dev/test/prod-Stufen, nie über Traefik freigegeben).
# Reines Static-Hosting: das Repo-Verzeichnis ist direkt in den nginx gemountet, Änderungen an den HTML-Dateien
# sind ohne Neustart sofort sichtbar (F5 reicht).
#
#   docker compose up -d     → http://localhost:8089/
#
# Port nach grav-gemeinsam/PROJEKTE.md («Belegte lokale Ports»).
name: agff-weideplaner
services:
  web:
    # Festgenagelt per Digest, nie «latest» (nginx 1.30-alpine, Stand 18.11.2026)
    image: nginx:1.30-alpine@sha256:3bc3836dc0be3b811f238210360bf8e7ca8a2d0effdae46160bf1f3578710051
    restart: unless-stopped
    ports: ["127.0.0.1:8089:80"]
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
