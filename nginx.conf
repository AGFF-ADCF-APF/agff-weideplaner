server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Nie cachen – wir wollen beim Testen immer den aktuellen Stand sehen.
    add_header Cache-Control "no-store" always;

    location ~ /\.(git|claude) { deny all; }
    location / { try_files $uri $uri/ =404; }
}
