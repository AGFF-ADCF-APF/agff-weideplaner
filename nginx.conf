server {
    listen 80;
    root /usr/share/nginx/html;
    # Wie .htaccess auf dem Server: Startadresse ist der Weideplaner v3, die Übersicht bleibt index.html.
    index AGFF_Weideplaner_v3.html index.html;
    charset utf-8;

    # Nie cachen – wir wollen beim Testen immer den aktuellen Stand sehen.
    add_header Cache-Control "no-store" always;

    location ~ /\.(git|claude) { deny all; }
    location / { try_files $uri $uri/ =404; }
}
